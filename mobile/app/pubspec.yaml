name: bitapp
description: Cortech BitApp

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+11

environment:
  # Dart SDK
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  app_common:
    path: ../common
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  expandable: ^5.0.1
  firebase_core: ^3.12.0
  flex_color_picker: ^3.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_gen: ^5.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_localizations:
    sdk: flutter
  flutter_speed_dial: ^7.0.0
  fl_chart: ^0.71.0
  font_awesome_flutter: 10.8.0
  go_router: 14.8.1
  http: ^1.3.0
  intl: 0.20.2
  logging: ^1.3.0
  package_info_plus: 8.3.0
  sembast: ^3.8.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cortech_logo.png
    - assets/images/bitapp_logo.png
    - assets/images/google_logo.png
    - assets/images/default.png
  fonts:
    - family: YesevaOne
      fonts:
        - asset: assets/fonts/YesevaOne-Regular.ttf
    - family: GlacialIndifference
      fonts:
        - asset: assets/fonts/GlacialIndifference-Regular.otf
        - asset: assets/fonts/GlacialIndifference-Bold.otf
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/bitapp_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
