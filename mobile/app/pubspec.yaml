name: bitapp
description: Cortech BitApp

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  # Dart SDK
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  expandable: ^5.0.1
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  flex_color_picker: ^3.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_gen: ^5.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_localizations:
    sdk: flutter
  flutter_speed_dial: ^7.0.0
  fl_chart: ^1.1.1
  font_awesome_flutter: ^10.12.0
  go_router: ^17.1.0
  google_sign_in: ^7.2.0
  http: ^1.3.0
  intl: 0.20.2
  kiwi: ^5.0.1
  logging: ^1.3.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.5
  uuid: ^4.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.1.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cortech_logo.png
    - assets/images/bitapp_logo.png
    - assets/images/google_logo.png
    - assets/images/default.png
  fonts:
    - family: YesevaOne
      fonts:
        - asset: assets/fonts/YesevaOne-Regular.ttf
    - family: GlacialIndifference
      fonts:
        - asset: assets/fonts/GlacialIndifference-Regular.otf
        - asset: assets/fonts/GlacialIndifference-Bold.otf
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/bitapp_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
