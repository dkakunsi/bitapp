name: Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "!backend/**/*.MD"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          VERSION=$(make backend-version)
          echo "Building backend version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          make backend GOAL=deploy VERSION="${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release Helm Chart
        run: make backend-chart TOKEN="${{ secrets.HELM_CHARTS_TOKEN }}" VERSION="${VERSION}"
      - name: Copy artifacts to dockerhub directory
        run: |
          mkdir -p ./dockerhub/maven
          cp ./backend/app/target/app.jar ./dockerhub/maven/
          cp ./backend/app/target/Dockerfile ./dockerhub/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dockerhub
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bitapp:${{ env.VERSION }}