name: Build Android Release

on:
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "!mobile/**/*.MD"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"

      - name: Install dependencies
        working-directory: mobile/app
        run: flutter pub get

      # Decode keystore dari GitHub Secrets
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/key.jks

      # Buat key.properties
      - name: Create key.properties
        run: |
          cat <<EOF > mobile/app/android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../../../key.jks
          EOF

      - name: Build APK (release)
        working-directory: mobile/app
        run: flutter build apk --release

      # Buat GitHub Release otomatis
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "BitApp Build ${{ github.run_number }}"
          files: mobile/app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
