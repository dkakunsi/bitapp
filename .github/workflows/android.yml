name: Build Android Release

on:
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "!mobile/**/*.MD"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"

      - name: Install dependencies
        working-directory: mobile/app
        run: flutter pub get

      # Decode keystore dari GitHub Secrets
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/key.jks

      # Buat key.properties
      - name: Create key.properties
        run: |
          cat <<EOF > mobile/app/android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../../../key.jks
          EOF

      # Buat gradle.properties
      - name: Create gradle.properties
        run: |
          cat <<EOF > mobile/app/android/gradle.properties
          org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.java.home=${JAVA_HOME}
          EOF

      - name: Set version
        id: versioning
        working-directory: mobile/app
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')

          MAJOR=$(echo $FULL_VERSION | cut -d. -f1)
          MINOR=$(echo $FULL_VERSION | cut -d. -f2)
          PATCH=$(echo $FULL_VERSION | cut -d. -f3)

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=${{ github.run_number }}

          echo "Using versionName=$VERSION_NAME"
          echo "Using versionCode=$VERSION_CODE"

          sed -i "s/^version: .*/version: ${VERSION_NAME}+${VERSION_CODE}/" pubspec.yaml

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Clean
        working-directory: mobile/app
        run: |
          flutter clean
          rm -rf build

      # - name: Build APK (release)
      #   working-directory: mobile/app
      #   run: flutter build apk --release

      # # Buat GitHub Release otomatis
      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: v${{ github.run_number }}
      #     name: "BitApp Build ${{ github.run_number }}"
      #     files: mobile/app/build/app/outputs/flutter-apk/app-release.apk
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AAB (release)
        working-directory: mobile/app
        run: |
          flutter build appbundle --release \
            --build-name "${{ steps.versioning.outputs.version_name }}" \
            --build-number "${{ steps.versioning.outputs.version_code }}"

      - name: Validate merged manifest SDK
        working-directory: mobile/app
        run: |
          MANIFEST_PATH="build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"

          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Merged manifest not found: $MANIFEST_PATH"
            exit 1
          fi

          TARGET_SDK=$(grep -o 'targetSdkVersion="[0-9]*"' "$MANIFEST_PATH" | head -n1 | tr -dc '0-9')
          MIN_SDK=$(grep -o 'minSdkVersion="[0-9]*"' "$MANIFEST_PATH" | head -n1 | tr -dc '0-9')
          VERSION_CODE=$(grep -o 'android:versionCode="[0-9]*"' "$MANIFEST_PATH" | head -n1 | tr -dc '0-9')

          echo "Merged manifest minSdkVersion: ${MIN_SDK}"
          echo "Merged manifest targetSdkVersion: ${TARGET_SDK}"
          echo "Merged manifest versionCode: ${VERSION_CODE}"

          if [ -z "$TARGET_SDK" ]; then
            echo "Failed to detect targetSdkVersion from merged manifest"
            exit 1
          fi

          if [ "$TARGET_SDK" -lt 34 ]; then
            echo "targetSdkVersion is too low: ${TARGET_SDK}"
            exit 1
          fi

          unzip -p mobile/app/build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml | grep -E "minSdkVersion|targetSdkVersion"

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GCP_SA_KEY }}
          packageName: io.dkakunsi.bitapp
          releaseFiles: mobile/app/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
