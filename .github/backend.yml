name: Backend

on:
  push:
    branches:
      - master
    paths:
      - "./backend/**"
      - "!./backend/Makefile"
      - "!./backend/**/*.MD"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Build
        run: make build GOAL=deploy
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}